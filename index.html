<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>حسابداری پلاس | نرم‌افزار حسابداری و فروشگاهی آنلاین</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0c11">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حسابداری پلاس">
    <meta name="description" content="نرم‌افزار حسابداری آنلاین فروشگاه: مدیریت مشتریان، کالا و انبار، فاکتور فروش و خرید، صندوق و بانک، هزینه‌ها و گزارش‌های مالی.">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font@v5.0.1/dist/font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v3.1.0/dist/font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/parastoo-font@v2.0.0/dist/font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>

    <a class="skip-link no-print" href="#mainContent">رفتن به محتوای اصلی</a>

    <div class="app-shell" id="appShell">

        <!-- ============ Sidebar (desktop) / Bottom nav (mobile) ============ -->
        <nav class="bottom-nav no-print" id="bottomNav">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon">
                    <img src="icons/icon-192.png" alt="حسابداری پلاس" width="36" height="36" loading="eager" id="sidebarBrandIconImg">
                </div>
                <span class="sidebar-brand-text" id="sidebarBrandText">حسابداری پلاس</span>
            </div>

            <div class="sidebar-scroll-area" id="sidebarScrollArea">
            <span class="nav-section-label">اصلی</span>
            <button class="bn-item active" data-view="home" onclick="switchView('home')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>خانه</span>
            </button>
            <button class="bn-item" data-view="dashboard" onclick="switchView('dashboard')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
                <span>داشبورد</span>
            </button>
            <button class="bn-item" data-view="invoices" onclick="switchView('invoices')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg>
                <span>فاکتور فروش</span>
            </button>
            <button class="bn-item" data-view="products" onclick="switchView('products')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
                <span>کالا و انبار</span>
            </button>

            <span class="nav-section-label">اشخاص</span>
            <button class="bn-item desktop-only-nav" data-view="customers" onclick="switchView('customers')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>مشتریان</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="purchases" onclick="switchView('purchases')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                <span>خرید از تأمین‌کننده</span>
            </button>

            <span class="nav-section-label">مالی</span>
            <button class="bn-item desktop-only-nav" data-view="treasury" onclick="switchView('treasury')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 6V4h12v2"/></svg>
                <span>صندوق و بانک</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="checks" onclick="switchView('checks')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                <span>چک‌ها</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="expenses" onclick="switchView('expenses')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                <span>هزینه‌ها</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="payroll" onclick="switchView('payroll')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><line x1="19" y1="6" x2="19" y2="10"/><line x1="17" y1="8" x2="21" y2="8"/></svg>
                <span>حقوق پرسنل</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="settlements" onclick="switchView('settlements')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                <span>بدهکاران و طلبکاران</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="partners" onclick="switchView('partners')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M17 11a4 4 0 1 0 0-8"/><path d="M1 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><path d="M17 13a4 4 0 0 1 4 4v2h-4"/></svg>
                <span>شرکا و سهم سود</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="stocktake" onclick="switchView('stocktake')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span>انبارگردانی</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="reports" onclick="switchView('reports')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span>گزارش‌ها</span>
            </button>

            <span class="nav-section-label">سیستم</span>
            <button class="bn-item desktop-only-nav" data-view="backup" onclick="switchView('backup')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                <span>پشتیبان‌گیری</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="help" onclick="switchView('help')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span>راهنما</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="about" onclick="switchView('about')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span>درباره برنامه</span>
            </button>
            <button class="bn-item desktop-only-nav" data-view="settings" onclick="switchView('settings')">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>تنظیمات</span>
            </button>
            <button class="bn-item" data-view="more" onclick="openMoreMenu()" id="moreNavBtn">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg>
                <span>بیشتر</span>
            </button>
            </div>

            <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" onclick="toggleSidebarCollapse()" title="جمع کردن منو">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                <span>جمع کردن منو</span>
            </button>
        </nav>
        <div id="bottomNavSpacer" class="no-print"></div>

        <!-- ============ Main column ============ -->
        <div class="main-col">
        <div class="app-container" id="mainContent">

            <div class="top-nav-bar no-print">
                <button class="nav-btn" id="hamburgerBtn" onclick="openMoreMenu()" title="فهرست بخش‌ها">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
                </button>
                <div class="top-nav-actions">
                    <span class="account-btn" id="storeChip" title="فروشگاه فعال">
                        <span class="account-avatar" id="storeAvatar">ف</span>
                        <span class="acc-label" id="storeChipLabel">فروشگاه</span>
                    </span>
                    <span class="cloud-status-chip" id="cloudStatusChip" onclick="onCloudChipClick()" title="وضعیت همگام‌سازی با گوگل">
                        <span class="cloud-status-dot" id="cloudStatusDot"></span>
                        <img id="cloudUserAvatar" class="cloud-user-avatar" style="display:none;" alt="">
                        <span id="cloudStatusLabel">ورود با گوگل</span>
                    </span>
                    <button class="nav-btn" onclick="toggleTheme()" title="تغییر تم (تاریک/روشن)">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    </button>
                    <button class="nav-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="حالت تمام‌صفحه">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                    </button>
                </div>
            </div>

            <div id="viewRoot"><!-- views render here --></div>

        </div>
        </div>
    </div>

    <!-- ============ Generic modal (single, content injected by JS) ============ -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-card" id="modalCard" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle"></span>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- ============ Jalali date-picker overlay (independent of the generic modal so it can
         stack on top of an already-open form/modal without wiping it out) ============ -->
    <div class="modal-overlay jalali-picker-overlay" id="jalaliOverlay" onclick="closeJalaliOverlayOnBg(event)">
        <div class="modal-card" id="jalaliCard" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title">انتخاب تاریخ</span>
                <button class="modal-close" onclick="closeJalaliPicker()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="jalaliBody"></div>
        </div>
    </div>

    <!-- ============ Post-onboarding welcome / tour-offer popup ============ -->
    <div class="modal-overlay" id="welcomeTourOverlay" onclick="event.stopPropagation()">
        <div class="modal-card" id="welcomeTourCard" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title">راهنمای شروع کار 👋</span>
                <button class="modal-close" onclick="dismissWelcomeTour()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="welcomeTourBody"></div>
        </div>
    </div>

    <!-- ============ Mobile "more" menu drawer ============ -->
    <div class="modal-overlay side-menu-overlay" id="moreMenuOverlay" onclick="closeModalOnOverlay(event,'moreMenuOverlay')">
        <div class="side-menu-panel" onclick="event.stopPropagation()">
            <div class="side-menu-header">
                <span class="modal-title">فهرست بخش‌ها</span>
                <button class="modal-close" onclick="closeMoreMenu()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="side-menu-body" id="moreMenuBody"></div>
        </div>
    </div>

    <!-- ============ Toast container ============ -->
    <div id="toastRoot" class="no-print" style="position:fixed; bottom:82px; left:50%; transform:translateX(-50%); z-index:4000; display:flex; flex-direction:column; gap:8px; width:min(360px,92vw);"></div>

    <!-- ============ Onboarding wizard ============ -->
    <div class="onboard-overlay no-print" id="onboardOverlay" hidden></div>

    <!-- Firebase (Google sign-in + Firestore cloud sync) — compat build, no bundler needed -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="app.js?v=9"></script>
</body>
</html>
